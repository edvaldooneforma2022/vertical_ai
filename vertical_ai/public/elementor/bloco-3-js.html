// Mapeamento de exemplos rápidos
const EXEMPLOS = {
  curso: { texto:'Curso online de marketing digital', nicho:'infoproduto' },
  clinica: { texto:'Clínica de estética em São Paulo', nicho:'negocio_local' },
  loja: { texto:'Loja virtual de roupas femininas', nicho:'ecommerce' },

// =====================================================
// ESTADO
// =====================================================
let nichoAtual = 'infoproduto';
let negocioNome = '';
let clienteCount = 0;
let timerInterval = null;
let tempoRestante = 300;
let ofertaMostrada = false;
let chatInterval = null;
let clienteIdx = 0;
let toastInterval = null;

// =====================================================
// UTILS
// =====================================================
function irParaCheckout() { window.open(CHECKOUT_URL,'_blank') }
function toggleFaq(btn) {
  const item=btn.parentElement;
  const open=item.classList.contains('open');
  document.querySelectorAll('.faq-item').forEach(i=>i.classList.remove('open'));
  if(!open) item.classList.add('open');
}
function showStep(id) {
  document.querySelectorAll('.demo-step').forEach(s=>{s.classList.remove('active');s.style.display='none'});
  const el=document.getElementById(id);el.style.display='block';el.classList.add('active');
}

function detectarNicho(texto) {
  const t = texto.toLowerCase();
  for (const [key,data] of Object.entries(NICHOS)) {
    if (data.keywords.some(k=>t.includes(k))) return key;
  }
  return 'infoproduto';
}

// =====================================================
// TOASTS (pressão silenciosa)
// =====================================================
const TOAST_MSGS = [
  '⚡ Outro visitante acabou de testar o sistema',
  '⚡ Um negócio de estética criou um atendimento agora',
  '⚡ Simulação de clientes iniciada por outro empreendedor',
  '⚡ Um afiliado testou o sistema com seu link agora',
  '⚡ Uma clínica ativou o atendimento automático'
];
let toastIdx = 0;
function showToast(msg) {
  const c = document.getElementById('toast-container');
  const div = document.createElement('div');
  div.className = 'toast';
  div.textContent = msg;
  c.appendChild(div);
  setTimeout(()=>div.remove(), 4200);
}
function iniciarToasts() {
  setTimeout(()=>{
    showToast(TOAST_MSGS[0]);
    toastInterval = setInterval(()=>{
      toastIdx = (toastIdx+1) % TOAST_MSGS.length;
      showToast(TOAST_MSGS[toastIdx]);
    }, 15000);
  }, 8000);
}

// =====================================================
// TESTAR EXEMPLO
// =====================================================
function testarExemplo(tipo) {
  const ex = EXEMPLOS[tipo];
  document.getElementById('url-input').value = ex.texto;
  nichoAtual = ex.nicho;
  iniciarDemo(true);
}

// =====================================================
// INICIAR DEMO → vai para personalização
// =====================================================
function iniciarDemo(skipDetect) {
  const input = document.getElementById('url-input');
  const err = document.getElementById('url-error');
  const texto = input.value.trim();
  err.style.display='none';
  if (!texto) { err.style.display='block'; input.focus(); return; }
  if (!skipDetect) nichoAtual = detectarNicho(texto);
  negocioNome = texto.length>40 ? texto.substring(0,40)+'...' : texto;
  showStep('step-type');
  document.getElementById('demo-zone').scrollIntoView({behavior:'smooth'});
}

// =====================================================
// PERSONALIZAÇÃO: escolher tipo
// =====================================================
function escolherTipo(tipo) {
  nichoAtual = tipo;
  const nichoData = NICHOS[nichoAtual] || NICHOS.infoproduto;
  document.getElementById('type-confirm').textContent = '✅ ' + nichoData.nome + ' selecionado';
  showStep('step-name');
}

// =====================================================
// PERSONALIZAÇÃO: confirmar nome
// =====================================================
function confirmarNome() {
  const nameInput = document.getElementById('name-input').value.trim();
  if (nameInput) negocioNome = nameInput;
  iniciarLoading();
}

// =====================================================
// LOADING
// =====================================================
async function iniciarLoading() {
  showStep('step-loading');
  const MSGS = [
    'Analisando conteúdo informado...',
    'Identificando tipo de negócio...',
    'Personalizando respostas para ' + negocioNome + '...',
    'Configurando base de respostas...',
    'Preparando atendimento automático...',
    'Sistema pronto. ✅'
  ];
  let pct=0, msgIdx=0;
  const fill=document.getElementById('progress-fill');
  const msgEl=document.getElementById('loading-msg');
  const pctEl=document.getElementById('progress-pct');
  fill.style.width='0%'; pctEl.textContent='0%';
  msgEl.textContent=MSGS[0];
  await new Promise(resolve=>{
    const iv=setInterval(()=>{
      pct=Math.min(pct+1.5,95);
      fill.style.width=pct+'%';
      pctEl.textContent=Math.round(pct)+'%';
      const ni=Math.floor((pct/95)*(MSGS.length-1));
      if(ni!==msgIdx){msgIdx=ni;msgEl.textContent=MSGS[msgIdx]}
      if(pct>=95){clearInterval(iv);resolve()}
    },70);
  });
  fill.style.width='100%'; pctEl.textContent='100%';
  msgEl.textContent=MSGS[MSGS.length-1];
  await new Promise(r=>setTimeout(r,800));
  iniciarChat();
}

// =====================================================
// CHAT (com nome do negócio nas respostas)
// =====================================================
function personalizarResposta(resposta) {
  if (negocioNome && negocioNome.length > 2) {
    const frases = resposta.split('.');
    if (frases.length > 1) {
      frases.splice(1, 0, ' Na ' + negocioNome + ', isso pode ser configurado facilmente');
      return frases.join('.');
    }
  }
  return resposta;
}

function iniciarChat() {
  showStep('step-chat');
  const nichoData = NICHOS[nichoAtual] || NICHOS.infoproduto;
  document.getElementById('chat-name').textContent = negocioNome || ('Atendimento — ' + nichoData.nome);
  clienteCount = 0;
  clienteIdx = 0;
  ofertaMostrada = false;
  document.getElementById('client-count').textContent = '0';
  document.getElementById('offer-section').style.display = 'none';
  document.getElementById('wow-box').style.display = 'none';
  document.getElementById('ig-sim-box').style.display = 'none';
  document.getElementById('messages-wrap').innerHTML = '';

  iniciarTimer();
  iniciarToasts();

  const msgInicial = negocioNome
    ? 'Sistema ativado para **' + negocioNome + '**. ✅\n\nAgora veja como o atendimento automático responde perguntas reais de clientes.'
    : 'Sistema ativado. ✅\n\nAgora veja como o atendimento automático responde perguntas reais de clientes.';

  setTimeout(()=>mostrarTyping(800,()=>{
    addMsg('bot', msgInicial);
  }),500);
  setTimeout(()=>simularProximoCliente(), 3500);
}

function simularProximoCliente() {
  const nichoData = NICHOS[nichoAtual] || NICHOS.infoproduto;
  if (clienteIdx >= nichoData.clientes.length) {
    if (!ofertaMostrada) { ofertaMostrada=true; setTimeout(mostrarWow, 1500); }
    return;
  }
  const cliente = nichoData.clientes[clienteIdx];
  let resposta = nichoData.respostas[clienteIdx];
  if ((clienteIdx === 1 || clienteIdx === 3) && negocioNome) {
    resposta = personalizarResposta(resposta);
  }
  clienteIdx++;
  addClientMsg(cliente.nome, cliente.origem, cliente.pergunta);
  clienteCount++;
  document.getElementById('client-count').textContent = clienteCount;
  setTimeout(()=>{
    mostrarTyping(900+resposta.length*4, ()=>{
      addMsg('bot', resposta);
      if (clienteIdx < nichoData.clientes.length) {
        setTimeout(simularProximoCliente, 4000);
      } else {
        if (!ofertaMostrada) { ofertaMostrada=true; setTimeout(mostrarWow, 2500); }
      }
    });
  }, 1200);
}

// =====================================================
// WOW MOMENT
// =====================================================
function mostrarWow() {
  const wow = document.getElementById('wow-box');
  document.getElementById('wow-count').textContent = clienteCount;
  if (negocioNome) {
    document.getElementById('wow-name-cta').textContent = 'Imagine isso respondendo todos os visitantes de ' + negocioNome + '.';
  }
  wow.style.display='block';
  wow.scrollIntoView({behavior:'smooth',block:'nearest'});
  setTimeout(()=>{
    document.getElementById('ig-sim-box').style.display='block';
  }, 2000);
  setTimeout(mostrarOferta, 4000);
}

// =====================================================
// INSTAGRAM SIMULATION
// =====================================================
function simularInstagram() {
  const wrap = document.getElementById('messages-wrap');
  const sep = document.createElement('div');
  sep.className='msg msg-bot';
  sep.innerHTML='📸 <strong>Simulação Instagram</strong><br><br>Veja como ficaria no DM do seu perfil:';
  wrap.appendChild(sep);
  wrap.scrollTop=wrap.scrollHeight;

  const igMsgs = [
    {nome:'@usuario_real', pergunta:'Oi! Vi seu post, vocês tem mais informações?'},
    {nome:'@curiosa.123', pergunta:'Isso funciona mesmo? Quero saber mais!'}
  ];

  let i = 0;
  function nextIg() {
    if (i >= igMsgs.length) return;
    const m = igMsgs[i]; i++;
    setTimeout(()=>{
      addClientMsg(m.nome, 'Instagram DM', m.pergunta);
      setTimeout(()=>{
        mostrarTyping(800, ()=>{
          const nichoData = NICHOS[nichoAtual] || NICHOS.infoproduto;
          addMsg('bot', nichoData.respostas[i-1] || 'Claro! Posso te ajudar com mais informações. O que gostaria de saber?');
          nextIg();
        });
      }, 1000);
    }, 2000);
  }
  nextIg();
}

function addMsg(tipo, texto) {
  const wrap=document.getElementById('messages-wrap');
  const div=document.createElement('div');
  div.className = tipo==='bot' ? 'msg msg-bot' : 'msg msg-client';
  div.innerHTML = texto.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  wrap.appendChild(div);
  wrap.scrollTop=wrap.scrollHeight;
}

function addClientMsg(nome, origem, texto) {
  const wrap=document.getElementById('messages-wrap');
  const div=document.createElement('div');
  div.className='msg msg-client';
  div.innerHTML=`<div class="msg-client-label">${nome} (${origem})</div>${texto}`;
  wrap.appendChild(div);
  wrap.scrollTop=wrap.scrollHeight;
}

function mostrarTyping(duracao, callback) {
  const wrap=document.getElementById('messages-wrap');
  const t=document.createElement('div');
  t.className='msg msg-typing';t.id='typing-indicator';
  t.innerHTML='<div class="dots"><span></span><span></span><span></span></div>';
  wrap.appendChild(t);wrap.scrollTop=wrap.scrollHeight;
  setTimeout(()=>{const el=document.getElementById('typing-indicator');if(el)el.remove();callback()},duracao);
}

function mostrarOferta() {
  const o=document.getElementById('offer-section');
  o.style.display='block';
  o.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// =====================================================
// TIMER
// =====================================================
function iniciarTimer() {
  if(timerInterval) clearInterval(timerInterval);
  tempoRestante=300;
  const el=document.getElementById('session-timer');
  timerInterval=setInterval(()=>{
    tempoRestante--;
    const m=Math.floor(tempoRestante/60).toString().padStart(2,'0');
    const s=(tempoRestante%60).toString().padStart(2,'0');
    el.textContent=m+':'+s;
    if(tempoRestante<=0){clearInterval(timerInterval);el.textContent='00:00';if(!ofertaMostrada){ofertaMostrada=true;mostrarOferta()}}
  },1000);
}

// =====================================================
// REINICIAR
// =====================================================
function reiniciarDemo() {
  if(timerInterval) clearInterval(timerInterval);
  if(toastInterval) clearInterval(toastInterval);
  showStep('step-url');
  document.getElementById('url-input').value='';
  document.getElementById('name-input').value='';
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('progress-pct').textContent='0%';
  document.getElementById('demo-zone').scrollIntoView({behavior:'smooth'});
}

// =====================================================
// ENTER handlers
// =====================================================
document.getElementById('url-input').addEventListener('keydown',e=>{if(e.key==='Enter')iniciarDemo()});
document.getElementById('name-input').addEventListener('keydown',e=>{if(e.key==='Enter')confirmarNome()});

    styles.textContent = '.lm-widget-container *{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Inter,-apple-system,BlinkMacSystemFont,sans-serif}.lm-widget-container{position:fixed;bottom:20px;right:20px;z-index:999999;display:flex;flex-direction:column;align-items:flex-end;gap:12px}.lm-greeting-tooltip{background:#1f2937;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:500;box-shadow:0 4px 15px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;animation:lm-slideIn .3s ease;cursor:pointer;transition:all .2s ease}.lm-greeting-tooltip:hover{transform:scale(1.02);box-shadow:0 6px 20px rgba(0,0,0,.2)}.lm-greeting-tooltip .lm-online-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:lm-pulse 2s infinite}.lm-greeting-tooltip.lm-hidden{display:none}.lm-bubble{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,'+config.primaryColor+' 0%,#1e40af 100%);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 15px rgba(59,130,246,.4);transition:all .3s ease}.lm-bubble:hover{transform:scale(1.1);box-shadow:0 6px 25px rgba(59,130,246,.5)}.lm-bubble svg{width:28px;height:28px;fill:#fff}.lm-bubble.lm-hidden{display:none}.lm-chat-window{position:fixed;bottom:90px;right:20px;width:380px;height:520px;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.15);display:none;flex-direction:column;overflow:hidden;animation:lm-scaleIn .3s ease;z-index:999998}.lm-chat-window.lm-open{display:flex}.lm-chat-header{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px;display:flex;align-items:center;justify-content:space-between}.lm-chat-header-left{display:flex;align-items:center;gap:12px}.lm-chat-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,'+config.primaryColor+' 0%,#8b5cf6 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:18px}.lm-chat-header-info{display:flex;flex-direction:column}.lm-chat-header-subtitle{font-size:12px;color:#6b7280}.lm-chat-header-title{font-size:15px;font-weight:600;color:#1f2937}.lm-header-btn{width:36px;height:36px;border-radius:50%;border:none;background:#f3f4f6;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;color:#6b7280}.lm-header-btn:hover{background:#e5e7eb;color:#1f2937}.lm-chat-messages{flex:1;padding:16px;overflow-y:auto;background:#f9fafb;display:flex;flex-direction:column;gap:12px}.lm-message{max-width:80%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5;animation:lm-fadeIn .3s ease}.lm-message.lm-bot{background:#fff;color:#1f2937;align-self:flex-start;border:1px solid #e5e7eb;border-bottom-left-radius:4px}.lm-message.lm-user{background:linear-gradient(135deg,'+config.primaryColor+' 0%,#1e40af 100%);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}.lm-typing{display:none;align-items:center;gap:4px;padding:12px 16px;background:#fff;border-radius:18px;border:1px solid #e5e7eb;align-self:flex-start;max-width:80px}.lm-typing.lm-active{display:flex}.lm-typing-dot{width:8px;height:8px;background:#9ca3af;border-radius:50%;animation:lm-typingBounce 1.4s infinite}.lm-typing-dot:nth-child(2){animation-delay:.2s}.lm-typing-dot:nth-child(3){animation-delay:.4s}.lm-chat-input-area{padding:16px;background:#fff;border-top:1px solid #e5e7eb;display:flex;align-items:center;gap:12px}.lm-chat-input{flex:1;border:1px solid #e5e7eb;border-radius:24px;padding:12px 20px;font-size:14px;outline:none;transition:all .2s ease;background:#f9fafb}.lm-chat-input:focus{border-color:'+config.primaryColor+';background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.1)}.lm-chat-input::placeholder{color:#9ca3af}.lm-send-btn{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,'+config.primaryColor+' 0%,#1e40af 100%);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease}.lm-send-btn:hover{transform:scale(1.05);box-shadow:0 4px 15px rgba(59,130,246,.4)}.lm-send-btn:disabled{opacity:.5;cursor:not-allowed}.lm-send-btn svg{width:20px;height:20px}.lm-lead-prompt{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin:8px 0;align-self:flex-start;max-width:90%}.lm-lead-prompt input{width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:10px;outline:none;transition:all .2s ease}.lm-lead-prompt input:focus{border-color:'+config.primaryColor+'}.lm-lead-prompt button{width:100%;background:linear-gradient(135deg,'+config.primaryColor+' 0%,#1e40af 100%);color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s ease}.lm-lead-prompt button:hover{opacity:.9}@keyframes lm-slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes lm-scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@keyframes lm-fadeIn{from{opacity:0}to{opacity:1}}@keyframes lm-pulse{0%,100%{opacity:1}50%{opacity:.5}}@keyframes lm-typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}@media (max-width:480px){.lm-chat-window{width:calc(100% - 20px);height:calc(100% - 100px);right:10px;bottom:80px;border-radius:20px}.lm-widget-container{right:10px;bottom:10px}.lm-bubble{width:55px;height:55px}.lm-greeting-tooltip{display:none}}';
    document.head.appendChild(styles);
    var container = document.createElement('div');
    container.className = 'lm-widget-container';
    container.id = 'lmWidgetContainer';
    container.innerHTML = '<div class="lm-greeting-tooltip" id="lmGreeting"><span class="lm-online-dot"></span><span>'+config.greetingMessage+'</span></div><div class="lm-bubble" id="lmBubble"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/><path d="M7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/></svg></div><div class="lm-chat-window" id="lmChatWindow"><div class="lm-chat-header"><div class="lm-chat-header-left"><div class="lm-chat-avatar">'+config.robotName.charAt(0).toUpperCase()+'</div><div class="lm-chat-header-info"><span class="lm-chat-header-subtitle">Assistente Virtual</span><span class="lm-chat-header-title">'+config.robotName+'</span></div></div><button class="lm-header-btn" id="lmCloseBtn" title="Fechar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="lm-chat-messages" id="lmMessages"></div><div class="lm-typing" id="lmTyping"><span class="lm-typing-dot"></span><span class="lm-typing-dot"></span><span class="lm-typing-dot"></span></div><div class="lm-chat-input-area"><input type="text" class="lm-chat-input" id="lmInput" placeholder="Escreva sua mensagem..." autocomplete="off"><button class="lm-send-btn" id="lmSendBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button></div></div>';
    document.body.appendChild(container);
    var chatWindow = document.getElementById('lmChatWindow');
    var bubble = document.getElementById('lmBubble');
    var greeting = document.getElementById('lmGreeting');
    var messages = document.getElementById('lmMessages');
    var input = document.getElementById('lmInput');
    var sendBtn = document.getElementById('lmSendBtn');
    var typing = document.getElementById('lmTyping');
    var closeBtn = document.getElementById('lmCloseBtn');
    function addMessage(text, isUser) {
        var msgDiv = document.createElement('div');
        msgDiv.className = 'lm-message ' + (isUser ? 'lm-user' : 'lm-bot');
        if (isUser) { msgDiv.textContent = text; }
        else if (/https?:\/\//.test(text)) {
            var esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            msgDiv.innerHTML = esc.replace(/(https?:\/\/[^\s<>"']+)/gi, function(u) {
                return '<a href="'+u+'" target="_blank" rel="noopener noreferrer" style="display:inline-block;background:linear-gradient(135deg,#10b981,#059669);color:white;padding:6px 14px;border-radius:16px;text-decoration:none;font-size:13px;font-weight:600;margin:4px 0;">&#128279; Acessar agora</a>';
            });
        } else { msgDiv.textContent = text; }
        messages.appendChild(msgDiv);
        messages.scrollTop = messages.scrollHeight;
    }
    function showLeadForm() {
        var formDiv = document.createElement('div');
        formDiv.className = 'lm-lead-prompt'; formDiv.id = 'lmLeadForm';
        formDiv.innerHTML = '<input type="text" id="lmLeadName" placeholder="Qual o seu nome?" required><input type="email" id="lmLeadEmail" placeholder="Seu melhor email"><input type="tel" id="lmLeadPhone" placeholder="WhatsApp (opcional)"><button id="lmLeadSubmit">Continuar conversa</button>';
        messages.appendChild(formDiv); messages.scrollTop = messages.scrollHeight;
        document.getElementById('lmLeadName').focus();
        document.getElementById('lmLeadSubmit').addEventListener('click', captureLead);
    }
    function captureLead() {
        var name = document.getElementById('lmLeadName').value.trim();
        var email = document.getElementById('lmLeadEmail').value.trim();
        var phone = document.getElementById('lmLeadPhone').value.trim();
        if (!name) { document.getElementById('lmLeadName').focus(); return; }
        var form = document.getElementById('lmLeadForm'); if (form) form.remove();
        fetch(apiBase + '/api/capture-lead', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nome: name, email: email || '', telefone: phone || '', url_origem: config.salesUrl, robotName: config.robotName, apiKey: config.apiKey })
        }).then(function(r){return r.json()}).then(function(data){
            if(data.success){leadId=data.lead.id;leadCaptured=true;addMessage('Olá '+name+'! Prazer em te conhecer. Como posso ajudar?',false);}
        }).catch(function(e){console.error('Erro:',e);leadCaptured=true;});
    }
    function sendMessage() {
        var message = input.value.trim(); if (!message) return;
        if (!leadCaptured) { showLeadForm(); return; }
        addMessage(message, true); input.value = ''; sendBtn.disabled = true;
        typing.classList.add('lm-active');
        fetch(apiBase + '/api/process-chat-inteligente', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message, pageData: { url: config.salesUrl }, robotName: config.robotName, instructions: config.instructions, conversationId: conversationId, leadId: leadId, apiKey: config.apiKey })
        }).then(function(r){return r.json()}).then(function(data){
            typing.classList.remove('lm-active');
            if(data.success&&data.response){addMessage(data.response,false);}
            else{addMessage('Desculpe, tive um problema. Pode repetir?',false);}
        }).catch(function(e){typing.classList.remove('lm-active');addMessage('Ops! Erro de conexão. Tente novamente.',false);console.error('Erro:',e);});
        sendBtn.disabled = false; input.focus();
    }
    function openChat() { isOpen=true; chatWindow.classList.add('lm-open'); greeting.classList.add('lm-hidden'); input.focus(); if(messages.children.length===0){addMessage(config.welcomeMessage,false);setTimeout(function(){addMessage(config.secondMessage,false);},800);} }
    function closeChat() { isOpen=false; chatWindow.classList.remove('lm-open'); }
    function toggleChat() { if(isOpen){closeChat();}else{openChat();} }
    bubble.addEventListener('click', toggleChat);
    greeting.addEventListener('click', openChat);
    closeBtn.addEventListener('click', closeChat);
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', function(e){if(e.key==='Enter')sendMessage();});
    console.log('✅ LinkMágico Widget v2.0 carregado!');
})();
</script>
