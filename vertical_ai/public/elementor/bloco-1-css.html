<!-- ============================================== -->
<!-- BLOCO 1 — CSS (cole no primeiro widget HTML)   -->
<!-- ============================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c28;--border:#2a2a3d;
  --purple:#7c3aed;--purple-light:#9f67ff;--green:#10b981;--green-light:#34d399;
  --text:#f1f0ff;--text-muted:#8b8aa0;--radius:14px;--yellow:#fbbf24;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}

/* HEADER */
.header{text-align:center;padding:16px 20px;border-bottom:1px solid var(--border);background:rgba(10,10,15,.92);position:sticky;top:0;z-index:100;backdrop-filter:blur(14px)}
.logo{font-size:1.25rem;font-weight:800;background:linear-gradient(135deg,var(--purple-light),var(--green-light));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* HERO */
.hero{text-align:center;padding:64px 20px 40px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:700px;height:400px;background:radial-gradient(ellipse,rgba(124,58,237,.22) 0%,transparent 70%);pointer-events:none}
.badge{display:inline-block;background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.35);color:var(--purple-light);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:999px;margin-bottom:20px}
.hero h1{font-size:clamp(1.9rem,4.5vw,3.2rem);font-weight:900;line-height:1.12;max-width:780px;margin:0 auto 18px}
.hero h1 span{background:linear-gradient(135deg,var(--purple-light),var(--green-light));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:1.05rem;color:var(--text-muted);max-width:540px;margin:0 auto}

/* SECTION */
.section{padding:72px 20px;max-width:880px;margin:0 auto}
.section-title{text-align:center;font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:800;margin-bottom:10px}
.section-sub{text-align:center;color:var(--text-muted);margin-bottom:44px;font-size:.95rem}
.divider{border:none;border-top:1px solid var(--border);margin:0}

/* CURIOSITY BLOCK */
.curiosity{max-width:700px;margin:0 auto;padding:48px 20px 0}
.curiosity-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 28px;position:relative;overflow:hidden}
.curiosity-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--green))}
.curiosity h3{font-size:1.15rem;font-weight:700;margin-bottom:20px;text-align:center}
.curiosity-msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.c-msg{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:.88rem;display:flex;align-items:center;gap:10px;animation:fadeUp .4s ease both}
.c-msg:nth-child(2){animation-delay:.1s}.c-msg:nth-child(3){animation-delay:.2s}.c-msg:nth-child(4){animation-delay:.3s}
.c-msg-origin{font-size:.7rem;color:var(--purple-light);font-weight:600;white-space:nowrap}
.c-msg-text{color:var(--text-muted)}
.curiosity-cta{text-align:center;margin-top:4px}
.curiosity-highlight{color:var(--green-light);font-weight:600;font-size:.95rem;margin-bottom:16px;text-align:center}

/* BUTTONS */
.btn-primary{display:block;width:100%;background:linear-gradient(135deg,var(--purple),var(--purple-light));color:#fff;border:none;border-radius:var(--radius);padding:16px 24px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;font-family:inherit;letter-spacing:.01em}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(124,58,237,.4)}
.btn-primary:active{transform:translateY(0)}
.btn-green{background:linear-gradient(135deg,#059669,var(--green-light));animation:pulse-green 2.5s infinite}
@keyframes pulse-green{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.35)}50%{box-shadow:0 0 0 12px rgba(16,185,129,0)}}
.btn-outline{background:none;border:2px solid var(--border);color:var(--text);border-radius:var(--radius);padding:14px 20px;font-size:.92rem;font-weight:600;cursor:pointer;transition:border-color .2s,background .2s;font-family:inherit;width:100%}
.btn-outline:hover{border-color:var(--purple-light);background:rgba(124,58,237,.08)}
.disclaimer{text-align:center;color:var(--text-muted);font-size:.78rem;margin-top:10px}

/* DEMO ZONE */
#demo-zone{padding:60px 20px}
.demo-container{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:36px 32px;box-shadow:0 0 60px rgba(124,58,237,.1)}
.demo-step{display:none}.demo-step.active{display:block}

/* STEP URL */
#step-url .step-headline{font-size:1.5rem;font-weight:800;margin-bottom:8px;line-height:1.25}
#step-url .step-sub{color:var(--text-muted);font-size:.9rem;margin-bottom:24px;line-height:1.65}
.input-wrap{position:relative;margin-bottom:12px}
.input-wrap input,.input-wrap textarea{width:100%;background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius);padding:15px 16px;font-size:.95rem;color:var(--text);font-family:inherit;transition:border-color .25s;outline:none;resize:none}
.input-wrap input:focus,.input-wrap textarea:focus{border-color:var(--purple)}
.input-wrap input::placeholder,.input-wrap textarea::placeholder{color:var(--text-muted)}
.url-error{color:#f87171;font-size:.82rem;margin-bottom:10px;display:none}

.examples-section{margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.examples-label{font-size:.8rem;color:var(--text-muted);margin-bottom:10px;text-align:center}
.examples-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.example-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:.82rem;cursor:pointer;transition:border-color .2s,background .2s;font-family:inherit;text-align:left;display:flex;align-items:center;gap:8px}
.example-btn:hover{border-color:var(--purple-light);background:rgba(124,58,237,.1)}
.example-btn .emoji{font-size:1.1rem}

/* LOADING */
#step-loading{text-align:center;padding:10px 0}
.loading-icon{font-size:2.8rem;margin-bottom:20px;animation:spin-slow 3s linear infinite}
@keyframes spin-slow{to{transform:rotate(360deg)}}
#step-loading h2{font-size:1.3rem;font-weight:700;margin-bottom:6px}
#loading-msg{color:var(--text-muted);font-size:.9rem;margin-bottom:24px;min-height:22px}
.progress-bar-wrap{background:var(--surface2);border-radius:999px;height:7px;overflow:hidden;margin-bottom:10px}
.progress-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--purple),var(--green));width:0%;transition:width .35s ease}
#progress-pct{font-size:.8rem;color:var(--text-muted)}

/* CHAT */
.chat-header{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:14px}
.chat-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--green));display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.chat-name{font-weight:700;font-size:.9rem}
.chat-status{font-size:.78rem;color:var(--green);display:flex;align-items:center;gap:5px}
.chat-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}

.timer-bar{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);border-radius:var(--radius);padding:9px 14px;font-size:.82rem;color:var(--purple-light);margin-bottom:14px;display:flex;align-items:center;gap:6px}
#session-timer{font-weight:700}

.messages-wrap{background:var(--surface2);border-radius:var(--radius);padding:14px;min-height:240px;max-height:360px;overflow-y:auto;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:.87rem;line-height:1.55;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-bot{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg-client{background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.25);align-self:flex-end;border-bottom-right-radius:4px}
.msg-client-label{font-size:.7rem;color:var(--purple-light);font-weight:600;margin-bottom:3px}
.msg-typing{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;padding:12px 16px}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--text-muted);margin:0 2px;animation:bounce .9s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

.client-counter{text-align:center;padding:10px 0;font-size:.82rem;color:var(--text-muted);margin-top:8px}
.client-counter strong{color:var(--green-light);font-size:1.1rem}

.btn-restart{margin-top:16px}

/* PERSONALIZE STEPS */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.type-btn{background:var(--surface2);border:2px solid var(--border);color:var(--text);border-radius:14px;padding:16px 14px;font-size:.88rem;cursor:pointer;transition:border-color .25s,background .25s,transform .15s;font-family:inherit;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.type-btn:hover{border-color:var(--purple-light);background:rgba(124,58,237,.08);transform:translateY(-2px)}
.type-btn .t-icon{font-size:1.6rem}
.type-btn .t-label{font-weight:600;font-size:.82rem}
.step-confirm{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:14px;padding:16px 20px;text-align:center;margin-bottom:18px;font-size:.9rem;color:var(--green-light);animation:fadeUp .4s ease}

/* WOW MOMENT */
.wow-box{background:linear-gradient(135deg,rgba(124,58,237,.1),rgba(16,185,129,.08));border:1px solid var(--border);border-radius:16px;padding:24px 20px;text-align:center;margin-top:18px;animation:fadeUp .5s ease}
.wow-box .wow-stat{font-size:2rem;font-weight:900;background:linear-gradient(135deg,var(--green),var(--green-light));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.wow-box .wow-text{color:var(--text-muted);font-size:.9rem;margin-top:6px}
.wow-box .wow-cta{color:var(--text);font-weight:700;font-size:1.05rem;margin-top:14px}

/* INSTAGRAM SIM */
.ig-sim-box{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:20px;margin-top:16px;text-align:center;animation:fadeUp .4s ease}
.ig-sim-box p{font-size:.9rem;color:var(--text-muted);margin-bottom:12px}
.btn-ig{background:linear-gradient(135deg,#E1306C,#833AB4,#5851DB);color:#fff;border:none;border-radius:var(--radius);padding:14px 20px;font-size:.92rem;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;font-family:inherit;width:100%}
.btn-ig:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(131,58,180,.4)}

/* OFFER */
#offer-section{display:none;border-top:1px solid var(--border);margin-top:20px;padding-top:26px;text-align:center;animation:fadeUp .5s ease}
.offer-label{font-size:.78rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.offer-title{font-size:1.35rem;font-weight:800;margin-bottom:6px}
.offer-price{font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,var(--green),var(--green-light));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.offer-price-sub{font-size:.82rem;color:var(--text-muted);margin-bottom:20px}
.offer-perks{list-style:none;margin-bottom:20px;text-align:left;display:inline-block}
.offer-perks li{font-size:.88rem;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.offer-perks li::before{content:'✅';font-size:.9rem}

/* NOTIFICATION TOAST */
.toast{position:fixed;bottom:24px;left:24px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 18px;font-size:.82rem;color:var(--text-muted);z-index:200;display:flex;align-items:center;gap:8px;animation:slideInToast .4s ease,fadeOutToast .4s ease 3.6s forwards;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@keyframes slideInToast{from{transform:translateX(-30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeOutToast{to{opacity:0;transform:translateX(-20px)}}

/* SOCIAL PROOF BAR */
.social-proof-bar{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;padding:14px 20px;background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.15);border-radius:14px;margin:0 auto 20px;max-width:700px}
.sp-item{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--text-muted);white-space:nowrap}
.sp-item .sp-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:lm-pulse 2s infinite}
@keyframes lm-pulse{0%,100%{opacity:1}50%{opacity:.5}}
.sp-item strong{color:var(--green-light)}

/* FOMO NOTIFICATION */
.fomo-toast{position:fixed;bottom:90px;left:24px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:.82rem;color:var(--text-muted);z-index:199;display:flex;align-items:center;gap:10px;animation:slideInToast .4s ease,fadeOutToast .4s ease 4.6s forwards;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fomo-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--green));display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}

/* VSL */
.vsl-section{margin:24px 0 20px;text-align:center}
.vsl-title{font-size:.95rem;color:var(--text);font-weight:600;margin-bottom:14px;line-height:1.5}
.vsl-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:16px;border:1px solid var(--border);background:#000}
.vsl-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.vsl-fallback{display:block;position:relative;cursor:pointer;text-decoration:none}
.vsl-fallback img{width:100%;border-radius:16px;display:block}
.vsl-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68px;height:68px;background:rgba(255,0,0,.85);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s}
.vsl-fallback:hover .vsl-play-btn{transform:translate(-50%,-50%) scale(1.15);background:rgba(255,0,0,1)}
.vsl-play-btn::after{content:'';border-style:solid;border-width:12px 0 12px 22px;border-color:transparent transparent transparent #fff;margin-left:4px}
.vsl-credibility{text-align:center;font-size:.82rem;color:var(--text-muted);margin-top:12px;font-style:italic}

/* SUPPORT CHAT BLOCK */
.support-block{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 28px;text-align:center}
.support-block h3{font-size:1.15rem;font-weight:700;margin-bottom:8px}
.support-block p{color:var(--text-muted);font-size:.9rem;margin-bottom:18px;line-height:1.6}
.btn-chat{display:inline-block;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border:none;border-radius:var(--radius);padding:16px 32px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;font-family:inherit;text-decoration:none}
.btn-chat:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(37,211,102,.35)}

/* EDUCATION BLOCKS */
.edu-block{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 28px}
.edu-block h3{font-size:1.2rem;font-weight:700;margin-bottom:16px}
.edu-list{list-style:none;display:flex;flex-direction:column;gap:12px}
.edu-list li{display:flex;align-items:flex-start;gap:10px;font-size:.9rem;color:var(--text-muted);line-height:1.6}
.edu-list li .icon{font-size:1.2rem;flex-shrink:0;margin-top:2px}
.edu-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.edu-tool{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:.82rem;color:var(--green-light);font-weight:600;display:flex;align-items:center;gap:6px}

/* WHERE IT WORKS */
.channels-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.channel-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 14px;text-align:center;transition:border-color .2s,transform .2s}
.channel-card:hover{border-color:var(--purple);transform:translateY(-3px)}
.channel-icon{font-size:2rem;margin-bottom:8px}
.channel-name{font-size:.82rem;font-weight:600}

/* HONESTY */
.honesty-box{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);border-radius:14px;padding:20px 24px;text-align:center;max-width:600px;margin:0 auto}
.honesty-box p{font-size:.88rem;color:var(--text-muted);line-height:1.7}
.honesty-box strong{color:var(--green-light)}

/* SOCIAL PROOF */
.proof-list{display:flex;flex-direction:column;gap:6px;max-width:400px;margin:0 auto}
.proof-item{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--text-muted);padding:6px 0}
.proof-item::before{content:'✓';color:var(--green);font-weight:700;font-size:1rem}

/* FAQ */
.faq-list{display:flex;flex-direction:column;gap:10px}
.faq-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .2s}
.faq-item.open{border-color:var(--purple)}
.faq-q{width:100%;background:none;border:none;color:var(--text);padding:16px 18px;font-size:.92rem;font-weight:600;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:inherit;gap:12px}
.faq-arrow{font-size:1rem;transition:transform .25s;flex-shrink:0}
.faq-item.open .faq-arrow{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .25s}
.faq-item.open .faq-a{max-height:300px;padding:0 18px 16px}
.faq-a p{color:var(--text-muted);font-size:.88rem;line-height:1.7}

/* FOOTER CTA */
.footer-cta{background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(16,185,129,.08));border-top:1px solid var(--border);padding:72px 20px;text-align:center}
.footer-cta h2{font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:900;margin-bottom:14px}
.footer-cta p{color:var(--text-muted);margin-bottom:28px;font-size:.95rem;max-width:500px;margin-left:auto;margin-right:auto}
footer{background:var(--surface);border-top:1px solid var(--border);padding:28px 20px;text-align:center;font-size:.78rem;color:var(--text-muted)}
footer a{color:var(--text-muted)}

@media(max-width:600px){
  .demo-container{padding:24px 18px}
  .examples-grid{grid-template-columns:1fr}
  .channels-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
